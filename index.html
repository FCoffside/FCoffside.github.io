<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Broadcast Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== SCOREBUG OVERLAY ===================== -->
  <div id="overlay">
    <div id="scorebug">

      <!-- Live pulse indicator -->
      <div class="live-badge">
        <span class="live-dot"></span>
        <span class="live-text">LIVE</span>
      </div>

      <!-- Home Team -->
      <div class="team-block home" id="home-block">
        <span class="team-name" id="home-name">ARS</span>
      </div>

      <!-- Score Area -->
      <div class="score-block">
        <span class="score" id="home-score">0</span>
        <span class="score-divider">–</span>
        <span class="score" id="away-score">0</span>
      </div>

      <!-- Away Team -->
      <div class="team-block away" id="away-block">
        <span class="team-name" id="away-name">MCI</span>
      </div>

      <!-- Timer Section -->
      <div class="timer-block" id="timer-block">
        <span class="match-time" id="match-time">00:00</span>
        <span class="added-time" id="added-time" style="display:none">+0</span>
        <span class="match-state" id="match-state">1H</span>
      </div>

    </div>
  </div>

  <!-- ===================== CONTROL PANEL ===================== -->
  <div id="control-panel" class="hidden">
    <div class="panel-header">
      <span class="panel-title">⚽ BROADCAST CONTROL</span>
      <button class="panel-close" id="panel-close" title="Close (H)">✕</button>
    </div>

    <div class="panel-body">

      <!-- Team Names -->
      <div class="control-section">
        <div class="section-label">TEAMS</div>
        <div class="control-row">
          <div class="team-input-group home-input">
            <label>Home</label>
            <input type="text" id="input-home-name" value="ARS" maxlength="6" />
          </div>
          <div class="team-input-group away-input">
            <label>Away</label>
            <input type="text" id="input-away-name" value="MCI" maxlength="6" />
          </div>
        </div>
        <div class="control-row">
          <label class="field-label">Home Color</label>
          <input type="color" id="home-color" value="#c0002e" />
          <label class="field-label">Away Color</label>
          <input type="color" id="away-color" value="#1b3f7e" />
        </div>
      </div>

      <!-- Score Controls -->
      <div class="control-section">
        <div class="section-label">SCORE</div>
        <div class="control-row">
          <div class="score-ctrl-group">
            <button class="btn score-btn minus" data-team="home" data-delta="-1">−</button>
            <span class="score-display" id="ctrl-home-score">0</span>
            <button class="btn score-btn plus" data-team="home" data-delta="1">+</button>
            <span class="score-label">HOME</span>
          </div>
          <div class="score-ctrl-group">
            <button class="btn score-btn minus" data-team="away" data-delta="-1">−</button>
            <span class="score-display" id="ctrl-away-score">0</span>
            <button class="btn score-btn plus" data-team="away" data-delta="1">+</button>
            <span class="score-label">AWAY</span>
          </div>
        </div>
      </div>

      <!-- Timer Controls -->
      <div class="control-section">
        <div class="section-label">MATCH TIMER</div>
        <div class="control-row timer-btns">
          <button class="btn btn-primary" id="btn-start">▶ START</button>
          <button class="btn btn-secondary" id="btn-pause">⏸ PAUSE</button>
          <button class="btn btn-danger" id="btn-reset">↺ RESET</button>
        </div>
        <div class="control-row timer-btns">
          <button class="btn btn-subtle" id="btn-minus10">−10s</button>
          <button class="btn btn-subtle" id="btn-plus10">+10s</button>
        </div>
        <div class="control-row">
          <label class="field-label">Set Time (MM:SS)</label>
          <input type="text" id="input-custom-time" placeholder="45:00" maxlength="5" />
          <button class="btn btn-subtle" id="btn-set-time">SET</button>
        </div>
      </div>

      <!-- Added Time -->
      <div class="control-section">
        <div class="section-label">ADDED TIME</div>
        <div class="control-row">
          <div class="slider-wrap">
            <input type="range" id="added-time-slider" min="0" max="15" value="0" step="1" />
            <div class="slider-labels">
              <span>0</span>
              <span id="added-time-value">None</span>
              <span>+15</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Match State -->
      <div class="control-section">
        <div class="section-label">MATCH STATE</div>
        <div class="control-row state-btns">
          <button class="btn state-btn active" data-state="1H">1H</button>
          <button class="btn state-btn" data-state="HT">HT</button>
          <button class="btn state-btn" data-state="2H">2H</button>
          <button class="btn state-btn" data-state="ET">ET</button>
          <button class="btn state-btn" data-state="FT">FT</button>
        </div>
      </div>

      <!-- Keyboard Hints -->
      <div class="control-section shortcuts">
        <div class="section-label">SHORTCUTS</div>
        <div class="shortcut-grid">
          <span class="key">SPACE</span><span>Start / Pause</span>
          <span class="key">←</span><span>−10 seconds</span>
          <span class="key">→</span><span>+10 seconds</span>
          <span class="key">R</span><span>Reset timer</span>
          <span class="key">H</span><span>Toggle panel</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Toggle hint when panel is hidden -->
  <div id="toggle-hint">Press <kbd>H</kbd> to open controls</div>

  <script src="script.js"></script>
</body>
</html>
